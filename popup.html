<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ValuTime</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="app-header">
  <div class="app-icon">&#x23F1;</div>
  <span class="app-name">ValuTime</span>
  <div class="header-clock">
    <div class="hc-t" id="hc-time"></div>
    <div id="hc-date"></div>
  </div>
</header>
<nav class="tab-bar">
  <button class="tab-btn active" data-tab="time">&#x1F310;<span class="tl">Time</span></button>
  <button class="tab-btn" data-tab="currency">&#x1F4B1;<span class="tl">Currency</span></button>
  <button class="tab-btn" data-tab="todo">&#x2705;<span class="tl">To-Do</span></button>
  <button class="tab-btn" data-tab="pomo">&#x1F345;<span class="tl">Pomo</span></button>
  <button class="tab-btn" data-tab="settings">&#x2699;&#xFE0F;<span class="tl">Settings</span></button>
</nav>
<div class="tab-content active" id="tab-time"></div>
<div class="tab-content" id="tab-currency"></div>
<div class="tab-content" id="tab-todo"></div>
<div class="tab-content" id="tab-pomo"></div>
<div class="tab-content" id="tab-settings"></div>
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
